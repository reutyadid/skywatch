[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ubuntu
# Ubuntu 24.04's Python, set explicitly instead of letting Ansible guess.
interpreter_python = /usr/bin/python3

[ssh_connection]
# Accept a new VM's host key the first time, but refuse a key that changed.
# ControlMaster/ControlPersist reuse one SSH connection per host (Ansible's defaults).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
