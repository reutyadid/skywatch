# The one Secret the cluster needs that can't live in Git (D-023). Runs before ArgoCD installs Grafana.
- name: Create the monitoring namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
    name: monitoring
    state: present

- name: Check whether the Grafana admin Secret exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Secret
    namespace: monitoring
    name: "{{ grafana_admin_secret }}"
  register: bootstrap_secrets_grafana

# Only when missing: a new password on every run would change the login and break changed=0.
- name: Create the Grafana admin Secret with a random password
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ grafana_admin_secret }}"
        namespace: monitoring
      type: Opaque
      # Key names are the Grafana chart's defaults (admin.userKey / admin.passwordKey).
      stringData:
        admin-user: admin
        admin-password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  when: bootstrap_secrets_grafana.resources | length == 0
  no_log: true
