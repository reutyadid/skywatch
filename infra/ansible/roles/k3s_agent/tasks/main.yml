# A new k3s_version downloads a new binary; the restart makes the running agent use it.
- name: Download the pinned K3s binary and verify its checksum
  ansible.builtin.get_url:
    url: "{{ k3s_download_url }}/k3s"
    checksum: "sha256:{{ k3s_download_url }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    mode: "0755"
  notify: Restart k3s-agent

# Read at run time from the server, never stored in Git (D-008). no_log keeps it out of the output.
- name: Read the join token from the server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  register: k3s_agent_node_token
  no_log: true

- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the K3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Write the K3s agent systemd unit
  ansible.builtin.template:
    src: k3s-agent.service.j2
    dest: /etc/systemd/system/k3s-agent.service
    mode: "0644"
  notify: Restart k3s-agent

- name: Start the K3s agent and enable it at boot
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true
