- name: Download the pinned K3s binary and verify its checksum
  ansible.builtin.get_url:
    url: "{{ k3s_download_url }}/k3s"
    checksum: "sha256:{{ k3s_download_url }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    mode: "0755"

- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the K3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Write the K3s server systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: Restart k3s

- name: Start K3s and enable it at boot
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

# The agents need the API and the join token, so don't move on until both exist.
- name: Wait for the Kubernetes API
  ansible.builtin.wait_for:
    port: 6443
    timeout: 120

- name: Wait for the join token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120
