# Full cluster bring-up. Safe to run again: a second run on a healthy cluster changes nothing.

# The VMs are created outside Ansible (create-vms.sh), and their names can take a moment to
# resolve. No facts here: gathering them needs the very connection this play waits for.
- name: Wait until every VM answers over SSH
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Install the K3s server
  hosts: server
  become: true
  roles:
    - k3s_server

- name: Join the workers to the server
  hosts: workers
  become: true
  roles:
    - k3s_agent

- name: Save the kubeconfig in WSL
  hosts: server
  become: true
  roles:
    - kubeconfig

# Runs in WSL against the Kubernetes API, not over SSH.
- name: Bootstrap the Grafana Secret and ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # The kubernetes library lives in .venv-ansible, not in the system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    # Secret first, so Grafana finds it when ArgoCD installs monitoring.
    - bootstrap_secrets
    - argocd
