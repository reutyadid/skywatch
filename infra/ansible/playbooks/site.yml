# Full cluster bring-up. Safe to run again: a second run on a healthy cluster changes nothing.
- name: Install the K3s server
  hosts: server
  become: true
  roles:
    - k3s_server

- name: Join the workers to the server
  hosts: workers
  become: true
  roles:
    - k3s_agent

- name: Save the kubeconfig in WSL
  hosts: server
  become: true
  roles:
    - kubeconfig

# Runs in WSL against the Kubernetes API, not over SSH.
- name: Bootstrap the Grafana Secret and ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # The kubernetes library lives in .venv-ansible, not in the system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    # Secret first, so Grafana finds it when ArgoCD installs monitoring.
    - bootstrap_secrets
    - argocd
