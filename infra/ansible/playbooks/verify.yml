# Checks the running cluster against docs/requirements-checklist.md (D-033).
# Read-only: every task only reads state, so it is safe to run at any time.
# The slow checks retry, so it also works right after `make cluster`, while ArgoCD is still syncing.

# Each VM's current IP, to compare with the IP Kubernetes has for its node.
- name: Read each VM's current IP
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather the network facts only
      ansible.builtin.setup:
        gather_subset: ["!all", "!min", network]

- name: Verify the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # The kubernetes library lives in .venv-ansible, not in the system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # K3s names a node after the VM's hostname, without the domain.
    verify_server_node: "{{ groups['server'][0].split('.')[0] }}"
    verify_argocd_apps: [root, skywatch, monitoring]
    # Must match the replicas in charts/skywatch/values.yaml.
    verify_replicas:
      skywatch-backend: 2
      skywatch-frontend: 1

  tasks:
    # Without SSH (VM stopped, or forwarding off after a Windows reboot) the first play has no IP.
    - name: Every VM's IP was read over SSH
      ansible.builtin.assert:
        that:
          - hostvars[item].ansible_default_ipv4 is defined
        fail_msg: >-
          Could not read the IP of {{ item }} over SSH. Is the VM running
          (multipass.exe list), and is forwarding on after a Windows reboot (README, step 2)?
        quiet: true
      loop: "{{ groups['all'] }}"

    - name: Wait until all 3 nodes are Ready (R2.3)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
      register: verify_nodes
      # Collect every node's conditions, keep the "Ready=True" ones, and count them.
      until: >-
        verify_nodes.resources
        | map(attribute='status.conditions') | flatten
        | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True')
        | list | length == 3
      retries: 30
      delay: 10

    # A host reboot can give a VM a new IP while K3s keeps the old one: Hyper-V restores the
    # VMs (AutomaticStopAction = Save) instead of rebooting them. Nodes and pods stay Ready,
    # but traffic between VMs breaks, so these two tasks look for the cause directly.
    # Right after a K3s restart an agent needs about a minute to update its IP, hence the wait.
    - name: Wait until the nodes' InternalIPs are the VMs' current IPs
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
      register: verify_node_ips
      # Both sides as sorted lists: each node's InternalIP, and each VM's IP read over SSH.
      until: >-
        verify_node_ips.resources | map(attribute='status.addresses')
        | map('selectattr', 'type', 'equalto', 'InternalIP') | map('map', attribute='address')
        | map('first') | sort
        == groups['all'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | sort
      retries: 12
      delay: 10
      # A mismatch is reported by the next task, per node and with the fix.
      failed_when: false

    - name: Each node's InternalIP is its VM's current IP
      vars:
        verify_node: "{{ verify_node_ips.resources | selectattr('metadata.name', 'equalto', item.split('.')[0]) | first }}"
        verify_node_ip: "{{ verify_node.status.addresses | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | first }}"
        verify_vm_ip: "{{ hostvars[item].ansible_default_ipv4.address }}"
      ansible.builtin.assert:
        that:
          - verify_node_ip == verify_vm_ip
        fail_msg: >-
          {{ item }}: Kubernetes has {{ verify_node_ip }}, but the VM now has {{ verify_vm_ip }}.
          The VM got a new IP without K3s restarting. Fix, in this order: restart k3s on the server,
          then k3s-agent on each worker, then run
          kubectl -n kube-system rollout restart deploy/coredns (see the README, step 2).
        quiet: true
      loop: "{{ groups['all'] }}"

    - name: Every node runs the pinned K3s version (R2.4)
      ansible.builtin.assert:
        that:
          - verify_nodes.resources | map(attribute='status.nodeInfo.kubeletVersion') | unique == [k3s_version]
        fail_msg: "Expected {{ k3s_version }} on every node"

    # Synced = the cluster matches Git. Healthy = everything in the app is running.
    - name: Wait until the ArgoCD apps are Synced and Healthy (R5.1-R5.3, B2)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: "{{ item }}"
      loop: "{{ verify_argocd_apps }}"
      register: verify_app
      # A new app has no status yet, hence the defaults.
      until: >-
        verify_app.resources | length == 1 and
        verify_app.resources[0].status.sync.status | default('') == 'Synced' and
        verify_app.resources[0].status.health.status | default('') == 'Healthy'
      retries: 60
      delay: 10

    - name: Read the app pods
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Pod
        namespace: skywatch
      register: verify_pods

    - name: The server is tainted and runs no app pods (R2.7)
      vars:
        # The server node, from the nodes read at the start.
        verify_server: "{{ verify_nodes.resources | selectattr('metadata.name', 'equalto', verify_server_node) | first }}"
      ansible.builtin.assert:
        that:
          - >-
            verify_server.spec.taints | default([])
            | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane')
            | selectattr('effect', 'equalto', 'NoSchedule') | list | length == 1
          - verify_pods.resources | map(attribute='spec.nodeName') | select('equalto', verify_server_node) | list == []
        fail_msg: "{{ verify_server_node }} must carry the control-plane taint and run no skywatch pods"

    - name: Read the app Deployments
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Deployment
        namespace: skywatch
      register: verify_deployments

    - name: Replicas, probes and resources are set and running (R4.3, R4.6, R4.7)
      ansible.builtin.assert:
        that:
          - item.spec.replicas == verify_replicas[item.metadata.name]
          - item.status.availableReplicas | default(0) == item.spec.replicas
          # Each line keeps the containers that miss something; the list must be empty.
          - item.spec.template.spec.containers | rejectattr('readinessProbe', 'defined') | list == []
          - item.spec.template.spec.containers | rejectattr('livenessProbe', 'defined') | list == []
          - item.spec.template.spec.containers | rejectattr('resources.requests', 'defined') | list == []
          - item.spec.template.spec.containers | rejectattr('resources.limits', 'defined') | list == []
        fail_msg: "{{ item.metadata.name }}: wrong replicas, or a container without probes or resources"
        # Without this, a passing assert prints the whole Deployment of each loop item.
        quiet: true
      loop: "{{ verify_deployments.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    # The port is read from the Service, so it can't drift from the chart.
    - name: Read the frontend Service
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Service
        namespace: skywatch
        name: skywatch-frontend
      register: verify_frontend

    # Through every node, not only the one running the frontend: kube-proxy sends a request
    # that reaches another node across flannel, so this also checks traffic between VMs.
    # Relies on the default externalTrafficPolicy (Cluster); with Local, other nodes would not answer.
    - name: The frontend answers on its NodePort through every node (R4.2)
      ansible.builtin.uri:
        url: "http://{{ item }}:{{ verify_frontend.resources[0].spec.ports[0].nodePort }}/healthz"
        status_code: 200
        timeout: 5
      loop: "{{ groups['all'] }}"
      register: verify_nodeport
      # kube-proxy and flannel may need a few seconds more than ArgoCD on a new cluster.
      until: verify_nodeport.status == 200
      retries: 6
      delay: 5

    - name: Read the Grafana admin Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: monitoring
        name: "{{ grafana_admin_secret }}"
      register: verify_grafana_secret
      # The result holds the password; keep it out of the output.
      no_log: true

    - name: The Grafana admin Secret exists (B1, D-023)
      ansible.builtin.assert:
        that:
          - verify_grafana_secret.resources | length == 1
        fail_msg: "Secret {{ grafana_admin_secret }} is missing in monitoring"
