<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyWatch</title>
  <style>
    body { font-family: sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: 0.4rem; }
    .temperature { font-size: 2.5rem; margin: 0.5rem 0; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>SkyWatch</h1>
  <p>Current weather for any city</p>

  <form action="/" method="get">
    <input type="text" name="city" value="{{ city }}" placeholder="Enter a city" aria-label="City" required>
    <button type="submit">Search</button>
  </form>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}

  {% if weather %}
  <h2>{{ weather.city }}, {{ weather.country }}</h2>
  <p class="temperature">{{ weather.temperature_c }} °C</p>
  <p>{{ weather.conditions }}</p>
  {% endif %}
</body>
</html>
