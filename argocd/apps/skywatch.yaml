# Deploys charts/skywatch from main (R5.2). The Helm release is named after the app: "skywatch".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skywatch
  namespace: argocd
  # Deleting this Application also deletes what it installed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/reutyadid/skywatch.git
    targetRevision: main
    path: charts/skywatch
  destination:
    server: https://kubernetes.default.svc
    namespace: skywatch
  syncPolicy:
    # prune: delete what was removed from Git. selfHeal: undo manual changes in the cluster (R5.3).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The ServiceMonitor and PrometheusRule need CRDs from the monitoring app, which may sync later.
    # They skip the dry run (see their annotations), so the app itself still deploys; these retries
    # apply them once the CRDs exist. A failed automated sync is not retried otherwise.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
