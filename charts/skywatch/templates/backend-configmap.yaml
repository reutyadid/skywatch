{{- $ctx := dict "root" . "component" "backend" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skywatch.fullname" . }}-backend
  labels:
    {{- include "skywatch.labels" $ctx | nindent 4 }}
data:
  PORT: {{ .Values.backend.port | quote }}
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
