{{- $ctx := dict "root" . "component" "frontend" }}
# NodePort: reachable from the host at http://<worker>.mshome.net:<nodePort> (D-025).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skywatch.fullname" . }}-frontend
  labels:
    {{- include "skywatch.labels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "skywatch.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      nodePort: {{ .Values.frontend.nodePort }}
